name: Set up deployment
description: Connect to the deployment network and authenticate to Nomad

runs:
  using: composite
  steps:
    - uses: sachahjkl/deployment-actions/.github/actions/setup-nix@v6.0.0
    - name: Join the deployment network
      uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.3
      with:
        oauth-client-id: TWg2iR2X7G11CNTRL-k23Swjrqst11CNTRL
        audience: api.tailscale.com/TWg2iR2X7G11CNTRL-k23Swjrqst11CNTRL
        tags: tag:github-actions-deploy
        ping: homelab.panthera-python.ts.net
    - name: Install Nomad
      shell: bash
      env:
        NOMAD_SHA256: 19dac5642a2ba5305e6ff8efee06a708d760ebe4d1cd7936bc3dc526f477dc12
        NOMAD_VERSION: 1.11.3
      run: |
        archive="$RUNNER_TEMP/nomad.zip"
        curl --fail --location --silent --show-error \
          "https://releases.hashicorp.com/nomad/$NOMAD_VERSION/nomad_${NOMAD_VERSION}_linux_amd64.zip" \
          --output "$archive"
        printf '%s  %s\n' "$NOMAD_SHA256" "$archive" | sha256sum --check
        unzip -q "$archive" -d "$RUNNER_TEMP/nomad-bin"
        printf '%s\n' "$RUNNER_TEMP/nomad-bin" >>"$GITHUB_PATH"
    - name: Authenticate to Nomad
      shell: bash
      run: |
        oidc=""
        for attempt in 1 2 3; do
          if oidc=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=nomad.sacha.house" \
            | jq -er .value); then
            break
          fi
          test "$attempt" -lt 3
          sleep 5
        done
        test -n "$oidc"
        token=$("$RUNNER_TEMP/nomad-bin/nomad" login \
          -method github-actions -login-token "$oidc" -json | jq -r .SecretID)
        test -n "$token" && test "$token" != null
        printf '::add-mask::%s\n' "$token"
        printf 'NOMAD_TOKEN=%s\n' "$token" >>"$GITHUB_ENV"
