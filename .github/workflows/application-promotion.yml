name: Application promotion

on:
  workflow_call:
    inputs:
      source-environment:
        description: Environment that supplies the tested image
        required: true
        type: string
      target-environment:
        description: Environment that receives the tested image
        required: true
        type: string
      publishing-workflow-version:
        description: Immutable deployment-actions version that published the image
        required: true
        type: string

env:
  NOMAD_ADDR: http://homelab.panthera-python.ts.net:4646

jobs:
  promote:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: ${{ inputs.target-environment }}
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
      packages: read
    concurrency:
      group: deploy-${{ inputs.target-environment }}-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sachahjkl/deployment-actions/.github/actions/setup-deployment@v6.0.0
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - id: image
        name: Verify the source image
        env:
          APPLICATION_CONTRACT: github:sachahjkl/application-contract/v2.2.1
          GH_TOKEN: ${{ github.token }}
          PUBLISHING_WORKFLOW_VERSION: ${{ inputs.publishing-workflow-version }}
          SOURCE_ENVIRONMENT: ${{ inputs.source-environment }}
        run: |
          job_name=$(nix run "$APPLICATION_CONTRACT" -- github-output \
            | sed -n 's/^name=//p')
          image=$(timeout 30s nomad job inspect \
            -namespace "$SOURCE_ENVIRONMENT" -json "$job_name" | jq -r .Meta.image)
          [[ "$image" =~ ^ghcr\.io/[a-z0-9_.-]+/[a-z0-9_.-]+@sha256:[0-9a-f]{64}$ ]]
          [[ "$PUBLISHING_WORKFLOW_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          identity="https://github.com/sachahjkl/deployment-actions/.github/workflows/application-ci.yml@refs/tags/$PUBLISHING_WORKFLOW_VERSION"
          timeout 2m cosign verify \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$image" >/dev/null 2>&1
          timeout 2m cosign verify-attestation \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --type spdxjson "$image" >/dev/null 2>&1
          timeout 2m gh attestation verify "oci://$image" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow sachahjkl/deployment-actions/.github/workflows/application-ci.yml \
            >/dev/null 2>&1
          printf 'value=%s\n' "$image" >>"$GITHUB_OUTPUT"
      - uses: sachahjkl/deployment-actions/.github/actions/deploy@v6.0.0
        with:
          environment: ${{ inputs.target-environment }}
          image: ${{ steps.image.outputs.value }}
