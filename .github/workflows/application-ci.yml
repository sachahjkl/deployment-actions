name: Application CI

on:
  workflow_call:
    inputs:
      deployment-environment:
        description: Environment deployed after publication
        required: true
        type: string

env:
  APPLICATION_CONTRACT: github:sachahjkl/application-contract/v2.2.1
  NOMAD_PACK: github:sachahjkl/nomad-pack/v1.4.0#default
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  NIX_CONFIG: |
    extra-experimental-features = nix-command flakes
    accept-flake-config = true
    max-jobs = 2
  NOMAD_ADDR: http://homelab.panthera-python.ts.net:4646

jobs:
  check:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sachahjkl/deployment-actions/.github/actions/setup-nix@v6.0.0
      - run: nix flake check --print-build-logs --max-jobs 2
      - name: Validate the application contract and Nomad Pack
        run: |
          nix run "$APPLICATION_CONTRACT" -- validate
          pack=$(nix build "$NOMAD_PACK" --no-link --print-out-paths)
          image="ghcr.io/$GITHUB_REPOSITORY@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          while IFS= read -r environment; do
            vars="$RUNNER_TEMP/$environment.vars.hcl"
            nix run "$APPLICATION_CONTRACT" -- nomad-vars "$environment" "$image" >"$vars"
            printf 'datacenter = "homelab"\nnode_class = "general"\n' >>"$vars"
            nix run nixpkgs#nomad-pack -- render "$pack" --var-file "$vars" \
              --ignore-missing-vars --to-dir "$RUNNER_TEMP/$environment-pack" --auto-approve >/dev/null
          done < <(nix run "$APPLICATION_CONTRACT" -- environment-names)

  publish:
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.repository != 'sachahjkl/application-template'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sachahjkl/deployment-actions/.github/actions/setup-nix@v6.0.0
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=sha,format=long
      - run: nix build .#dockerImage --print-build-logs --max-jobs 2
      - id: publish
        name: Push OCI image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          umask 077
          authfile="$RUNNER_TEMP/skopeo-auth.json"
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$GHCR_TOKEN" | nix run nixpkgs#skopeo -- login \
            --authfile "$authfile" ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          tag=$(printf '%s\n' "$IMAGE_TAGS" | sed -n '1p')
          nix run nixpkgs#skopeo -- copy --authfile "$authfile" --insecure-policy \
            docker-archive:result "docker://$tag"
          digest=$(nix run nixpkgs#skopeo -- inspect --authfile "$authfile" \
            --format '{{.Digest}}' "docker://$tag")
          printf 'image=%s@%s\n' "$IMAGE_NAME" "$digest" >>"$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
      - name: Generate SPDX SBOM
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          SBOM: ${{ runner.temp }}/application.spdx.json
        run: nix run nixpkgs#syft -- "$IMAGE" --output "spdx-json=$SBOM"
      - name: Sign image and attest SBOM
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.publish.outputs.image }}
          SBOM: ${{ runner.temp }}/application.spdx.json
        run: |
          retry() {
            for attempt in 1 2 3; do
              if "$@"; then
                return
              fi
              test "$attempt" -lt 3
              sleep 5
            done
          }
          printf '%s' "$GHCR_TOKEN" | nix run nixpkgs#cosign -- login \
            ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          retry nix run nixpkgs#cosign -- sign --yes "$IMAGE"
          retry nix run nixpkgs#cosign -- attest --yes \
            --type spdxjson --predicate "$SBOM" "$IMAGE"
      - name: Publish build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: ${{ inputs.deployment-environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-${{ inputs.deployment-environment }}-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sachahjkl/deployment-actions/.github/actions/setup-deployment@v6.0.0
      - uses: sachahjkl/deployment-actions/.github/actions/deploy@v6.0.0
        with:
          environment: ${{ inputs.deployment-environment }}
          image: ${{ needs.publish.outputs.image }}
